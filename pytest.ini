[pytest]
# Minimum required version of pytest
minversion = 7.0

# Default command-line arguments applied every time you run 'pytest'
addopts = -v --tb=short --strict-markers --html=reports/report.html --self-contained-html

# Directories where pytest should search for tests
testpaths = tests

# Custom test file naming patterns (default is test_*.py or *_test.py)
python_files = test_*.py *_test.py

# Custom test class naming patterns (default is Test*)
python_classes = Test*

# Custom test function naming patterns (default is test_*)
python_functions = test_*

# Custom markers to categorize tests (avoids pytest warning notices)
markers = 
    sanity: Quick sanity tests for core functionality
    regression: Full regression test suite
    funcational: testing the funcationality of the feature
